<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Anas Ezz, Mobile Software Engineer, Flutter">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1324"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="spread" spreadMethod="repeat" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
  </linearGradient>
  <linearGradient id="sk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1E293B"/><stop offset=".5" stop-color="#334155"/><stop offset="1" stop-color="#1E293B"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="1.8s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;40 40" dur="8s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".35" cy=".45" r=".75">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  <clipPath id="screen"><rect x="10" y="10" width="160" height="244" rx="20"/></clipPath>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 18px; fill: #94A3B8; }
    .caret { fill: #2DD4BF; }
    .up { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .orbA { animation: driftA 14s ease-in-out infinite alternate; }
    .orbB { animation: driftB 18s ease-in-out infinite alternate; }
    @keyframes driftA { to { transform: translate(140px, 40px); } }
    @keyframes driftB { to { transform: translate(-160px, -30px); } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .chip { animation: float 5s ease-in-out infinite; }
    .c2 { animation-duration: 6.5s; animation-delay: -2s; } .c3 { animation-duration: 7.5s; animation-delay: -4s; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(3); opacity: 0; } }
    .card { opacity: 0; animation: card 6s ease-in-out infinite; }
    .k2 { animation-delay: .25s; } .k3 { animation-delay: .5s; }
    @keyframes card { 0% { opacity: 0; transform: translateY(10px); } 10%,85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
</defs>

<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)" opacity=".55"/>
  <circle class="orbA" cx="260" cy="60" r="150" fill="#0F766E" opacity=".45" filter="url(#blur)"/>
  <circle class="orbB" cx="980" cy="260" r="170" fill="#0369A1" opacity=".45" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#1E293B"/>

<!-- status pill -->
<g class="up d1">
  <rect x="80" y="56" width="268" height="32" rx="16" fill="#0F766E" fill-opacity=".14" stroke="#2DD4BF" stroke-opacity=".35"/>
  <circle class="pulse" cx="101" cy="72" r="5" fill="#34D399"/>
  <circle cx="101" cy="72" r="5" fill="#34D399"/>
  <text x="116" y="77" class="sans" font-size="14" font-weight="500" fill="#A7F3D0">Open to remote &amp; freelance work</text>
</g>

<!-- name + title -->
<text x="78" y="162" class="sans up d2" font-size="66" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Anas Ezz</text>
<text x="80" y="204" class="sans up d3" font-size="25" font-weight="600" fill="url(#shine)">Mobile Software Engineer | Flutter</text>

