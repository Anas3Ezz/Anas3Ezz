<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-label="divider">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
  </linearGradient>
  <style>
    .sweep { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-320px); } to { transform: translateX(1200px); } }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #64748B; }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>
</defs>
<rect x="0" y="20" width="1200" height="1" fill="#1E293B"/>
<rect class="sweep" x="0" y="19" width="320" height="3" rx="1.5" fill="url(#g)"/>
<text x="600" y="48" text-anchor="middle" class="t">thanks for stopping by</text>
</svg>
